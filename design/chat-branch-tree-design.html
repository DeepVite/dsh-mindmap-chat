<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>聊天分支树 · 产品设计原型</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #151a24;
    --panel2: #1c2331;
    --panel3: #222b3d;
    --border: #28324a;
    --guide: #252f45;
    --text: #e9edf6;
    --dim: #96a1b8;
    --faint: #6b7690;
    --accent: #4f7cff;
    --accent2: #7c9bff;
    --accent-soft: rgba(79, 124, 255, .14);
    --green: #34d399;
    --amber: #fbbf24;
    --blue: #60a5fa;
    --purple: #a78bfa;
    --danger: #f87171;
    --shadow: 0 24px 64px rgba(0, 0, 0, .5);
    --card: #1a2130;
    --card-border: #2a3550;
    --input-bg: #10141d;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f3f5f9;
      --panel: #ffffff;
      --panel2: #eef1f7;
      --panel3: #e2e7f1;
      --border: #d7deec;
      --guide: #dfe5f0;
      --text: #1c2333;
      --dim: #5c67a3;
      --faint: #8a94ad;
      --accent: #3b6cf0;
      --accent2: #5a86ff;
      --accent-soft: rgba(59, 108, 240, .10);
      --green: #0da36b;
      --amber: #d99000;
      --blue: #2f7fd9;
      --purple: #7c5cd6;
      --danger: #d94f4f;
      --shadow: 0 24px 64px rgba(30, 40, 70, .18);
      --card: #ffffff;
      --card-border: #dce3f0;
      --input-bg: #ffffff;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    overflow: hidden;
  }
  button {
    font: inherit;
    color: inherit;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 6px; }

  #app { display: flex; height: 100vh; }

  /* ---------- 左侧边栏 ---------- */
  #sidebar {
    width: 302px;
    min-width: 302px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }
  .sb-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 12px 8px;
  }
  .sb-title { font-size: 14px; font-weight: 700; flex: 1; }
  .sb-title small { color: var(--faint); font-weight: 400; margin-left: 6px; }
  .icon-btn {
    width: 28px; height: 28px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 8px;
    background: var(--panel2);
    border: 1px solid var(--border);
    font-size: 14px;
  }
  .icon-btn:hover { background: var(--panel3); }
  .icon-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

  .ws-chips {
    display: flex;
    gap: 6px;
    padding: 0 12px 8px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .ws-chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--dim);
    font-size: 12px;
    white-space: nowrap;
  }
  .chip:hover { color: var(--text); }
  .chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent2); }

  .search-wrap { position: relative; padding: 0 12px 8px; }
  .search-box {
    width: 100%;
    padding: 7px 10px 7px 30px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    font: inherit;
    outline: none;
  }
  .search-box::placeholder { color: var(--faint); }
  .search-icon {
    position: absolute; left: 22px; top: 15px;
    color: var(--faint); pointer-events: none; font-size: 12px;
  }
  .search-results {
    position: absolute;
    left: 12px; right: 12px; top: 42px;
    z-index: 20;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
    overflow: hidden;
    max-height: 260px;
    overflow-y: auto;
  }
  .search-results.hidden { display: none; }
  .sr-item { padding: 8px 10px; cursor: pointer; border-bottom: 1px solid var(--guide); }
  .sr-item:last-child { border-bottom: none; }
  .sr-item:hover { background: var(--panel3); }
  .sr-title { font-weight: 600; margin-bottom: 2px; }
  .sr-snippet {
    color: var(--dim); font-size: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  #tree { flex: 1; overflow-y: auto; padding: 2px 8px 12px; }

  /* 树节点 */
  .node {}
  .row {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px 8px 5px 4px;
    border-radius: 8px;
    cursor: pointer;
    position: relative;
    min-height: 30px;
  }
  .row:hover { background: var(--panel2); }
  .row.current {
    background: var(--accent-soft);
    box-shadow: inset 2px 0 0 var(--accent);
  }
  .chevron {
    width: 18px; height: 18px;
    flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--faint);
    border-radius: 5px;
    font-size: 10px;
  }
  .chevron:hover { background: var(--panel3); color: var(--text); }
  .chevron.empty { visibility: hidden; }
  .row-icon { flex: none; font-size: 13px; width: 16px; text-align: center; }
  .row-title {
    flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row-title.faint { color: var(--dim); }
  .row-tags { flex: none; display: inline-flex; gap: 4px; align-items: center; }
  .tag {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--faint);
    background: var(--panel2);
  }
  .tag.fork { color: var(--accent2); border-color: rgba(79,124,255,.35); }
  .tag.sub { color: var(--purple); border-color: rgba(167,139,250,.35); }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .dot.run { background: var(--blue); animation: pulse 1.4s ease-in-out infinite; }
  .dot.wait { background: var(--amber); }
  .dot.done { background: var(--green); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .row .acts { display: inline-flex; gap: 2px; opacity: 0; transition: opacity .12s; }
  .row:hover .acts, .row.current .acts { opacity: 1; }
  .act {
    width: 22px; height: 22px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 6px;
    color: var(--dim);
    font-size: 12px;
  }
  .act:hover { background: var(--panel3); color: var(--text); }
  .act.primary:hover { background: var(--accent-soft); color: var(--accent2); }

  .children {
    margin-left: 15px;
    padding-left: 7px;
    border-left: 1px solid var(--guide);
  }
  .children.hidden { display: none; }
  .picker-slot:empty { display: none; }
  .picker-slot {
    margin: 4px 0 8px 38px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    animation: slideIn .16s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .picker-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px;
    border-bottom: 1px solid var(--guide);
    color: var(--dim);
    font-size: 12px;
  }
  .picker-close {
    color: var(--faint); width: 20px; height: 20px; border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .picker-close:hover { background: var(--panel3); color: var(--text); }
  .turn {
    padding: 8px 12px;
    border-bottom: 1px solid var(--guide);
    cursor: pointer;
  }
  .turn:hover { background: var(--panel3); }
  .turn-user { font-weight: 600; line-height: 1.5; }
  .turn-user .idx { color: var(--accent2); font-weight: 700; margin-right: 6px; }
  .turn-reply {
    margin-top: 3px;
    color: var(--dim);
    font-size: 12px;
    line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .turn .fork-hint {
    display: inline-block;
    margin-top: 6px;
    font-size: 11px;
    color: var(--accent2);
    background: var(--accent-soft);
    padding: 2px 8px;
    border-radius: 999px;
  }
  .picker-foot { padding: 8px 12px; }
  .btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    font-size: 12px;
  }
  .btn:hover { background: var(--panel3); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); }

  .flash { animation: flashBg 1.4s ease; }
  @keyframes flashBg {
    0% { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
    100% { background: transparent; }
  }

  .sb-foot {
    border-top: 1px solid var(--border);
    padding: 8px 12px;
    color: var(--faint);
    font-size: 11px;
    line-height: 1.7;
  }
  .sb-foot b { color: var(--dim); }

  /* ---------- 聊天主区（示意） ---------- */
  #chat { flex: 1; display: flex; flex-direction: column; background: var(--bg); }
  .chat-head {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .chat-title { font-weight: 700; font-size: 14px; }
  .chat-inherit {
    font-size: 11px; color: var(--accent2);
    background: var(--accent-soft);
    border-radius: 999px; padding: 2px 10px;
  }
  .chat-body {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20%;
    display: flex; flex-direction: column; gap: 14px;
  }
  .bubble { max-width: 76%; padding: 10px 14px; border-radius: 14px; line-height: 1.6; }
  .bubble.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .bubble.assistant { align-self: flex-start; background: var(--panel2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .chat-composer {
    margin: 0 20% 20px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--panel);
    padding: 12px 16px;
    color: var(--faint);
  }

  /* ---------- 导图悬浮层 ---------- */
  #map-overlay {
    position: fixed; inset: 0;
    background: rgba(4, 7, 13, .55);
    backdrop-filter: blur(3px);
    z-index: 50;
    display: flex;
    padding: 26px;
  }
  @media (prefers-color-scheme: light) {
    #map-overlay { background: rgba(30, 40, 70, .28); }
  }
  #map-overlay.hidden { display: none; }
  .map-panel {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .map-head {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .map-head .title { font-weight: 700; flex: 1; }
  .map-tools { display: inline-flex; gap: 6px; }
  .map-body { flex: 1; display: flex; min-height: 0; }
  #map-canvas {
    flex: 1;
    position: relative;
    overflow: hidden;
    cursor: grab;
    background-image: radial-gradient(var(--guide) 1px, transparent 1px);
    background-size: 26px 26px;
  }
  #map-canvas.dragging { cursor: grabbing; }
  #map-inner { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #map-edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .map-card {
    position: absolute;
    width: 208px;
    padding: 10px 12px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    box-shadow: 0 6px 18px rgba(0,0,0,.25);
    cursor: pointer;
    transition: border-color .12s, transform .12s;
  }
  .map-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .map-card.current { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft), 0 6px 18px rgba(0,0,0,.3); }
  .map-card.sub { border-style: dashed; }
  .mc-title {
    font-weight: 600;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .mc-meta { margin-top: 5px; color: var(--dim); font-size: 11px; }
  .mc-status { margin-top: 5px; font-size: 11px; color: var(--faint); display: inline-flex; gap: 5px; align-items: center; }
  .mc-acts {
    margin-top: 8px;
    display: inline-flex; gap: 6px;
    opacity: 0;
    transition: opacity .12s;
  }
  .map-card:hover .mc-acts { opacity: 1; }
  .edge-label {
    position: absolute;
    transform: translate(-50%, -50%);
    font-size: 11px;
    color: var(--dim);
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 9px;
    white-space: nowrap;
    pointer-events: none;
  }
  .edge-label.sub { color: var(--purple); }
  .map-hint {
    position: absolute; left: 16px; bottom: 12px;
    color: var(--faint); font-size: 11px;
    pointer-events: none;
  }
  #map-picker {
    width: 300px;
    border-left: 1px solid var(--border);
    background: var(--panel2);
    overflow-y: auto;
  }
  #map-picker.hidden { display: none; }
  #map-picker .picker-head { position: sticky; top: 0; background: var(--panel2); z-index: 2; }

  #toast {
    position: fixed;
    left: 50%; bottom: 28px;
    transform: translateX(-50%) translateY(12px);
    background: var(--panel3);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 18px;
    border-radius: 999px;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s, transform .18s;
    z-index: 99;
    max-width: 70vw;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sb-head">
      <div class="sb-title">💬 会话<small>分支树</small></div>
      <button class="icon-btn primary" id="btn-new" title="新建会话">＋</button>
      <button class="icon-btn" id="btn-map" title="思维导图视图">🗺</button>
    </div>
    <div class="ws-chips" id="ws-chips"></div>
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input class="search-box" id="search-input" placeholder="搜索任意会话的消息内容…">
      <div class="search-results hidden" id="search-results"></div>
    </div>
    <div id="tree"></div>
    <div class="sb-foot">
      <b>🔀 分支</b> 挂在源会话下，与资源管理器一致<br>
      <b>✂ 分叉点</b> = 你选中的那一轮对话<br>
      <b>🗺 导图</b> 与左侧树共用同一份数据
    </div>
  </aside>

  <main id="chat">
    <div class="chat-head">
      <div class="chat-title" id="chat-title">开发 DeepSeek 插件</div>
      <div class="chat-inherit hidden" id="chat-inherit"></div>
    </div>
    <div class="chat-body">
      <div class="bubble user">我们聊过：从中间步骤 fork 出新分支，聊天记录其实是树状的。</div>
      <div class="bubble assistant">对。本产品里每次 fork 都会在左侧生成一个挂在源会话下面的新会话，新分支继承分叉点之前的历史。</div>
      <div class="bubble user">左边这棵树就是聊天记录的树。点任意节点可以切过去，✂ 可以选择从哪条消息开始分叉。</div>
      <div class="bubble assistant">右上角 🗺 可以把同一棵树展开成思维导图，拖动、缩放查看全貌。</div>
    </div>
    <div class="chat-composer">输入消息…（原型示意区）</div>
  </main>
</div>

<div id="map-overlay" class="hidden">
  <div class="map-panel">
    <div class="map-head">
      <div class="title">🗺 分支思维导图</div>
      <div class="map-tools">
        <button class="btn" id="map-zoom-out" title="缩小">－</button>
        <button class="btn" id="map-fit" title="适应窗口">适应</button>
        <button class="btn" id="map-zoom-in" title="放大">＋</button>
        <button class="btn" id="map-close" title="关闭">✕ 关闭</button>
      </div>
    </div>
    <div class="map-body">
      <div id="map-canvas">
        <div id="map-inner"></div>
        <div class="map-hint">拖拽平移 · 滚轮缩放 · 点击节点打开会话 · 悬停节点可开分支</div>
      </div>
      <div id="map-picker" class="hidden"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';

/* ============ 演示数据 ============ */
const DATA = {
  sessions: [
    { id: 's0', title: '开发 DeepSeek 插件', parent: null, running: false, pending: false, done: false, current: true,
      messages: [
        { user: '我要开发一个 DeepSeek 插件，用于聊天分支管理，聊天记录其实是树状的', reply: '需求收到。核心是把「fork 出来的会话」组织成一棵树，而不是平铺列表。' },
        { user: '分支能像资源管理器一样显示在左侧吗？新分支挂在原会话下面', reply: '可以。fork 出的子会话会继承分叉点之前的历史，血缘关系正好对应树的父子关系。' },
        { user: '从对话中间拉分支时，怎么选分叉点？', reply: '点会话上的 ✂，列出历史消息，选中某一轮之后分叉——新分支继承到那一轮为止。' },
        { user: '分支多起来会不会乱？', reply: '支持折叠/展开；状态点区分运行中、待处理、已完成；当前会话高亮。' },
        { user: '还需要一个思维导图视图', reply: '树和导图共用同一份数据：左侧是资源管理器式的树，导图是它的另一种投影。' },
        { user: '分叉点的信息要显示出来', reply: '导图连线上的标签会写「分叉于第 N 条消息」。' },
        { user: '创建新分支后最好直接打开它', reply: '默认行为：分叉完成即打开新分支。' },
      ] },
    { id: 'sA', title: '分支 A：树形侧边栏', parent: 's0', forkAt: 2, running: false, pending: false, done: false, current: false,
      messages: [
        { user: '树形侧边栏这个方向，先做折叠/展开', reply: '好，按资源管理器的交互来：chevron 展开、缩进线、悬停出现操作。' },
        { user: '悬停操作要有「尾部开分支」和「按消息开分支」两个入口', reply: '⑂ 直接在末尾分叉；✂ 打开选点面板，挑某一轮。' },
        { user: '分支多了以后要能搜索', reply: '顶部搜索框按消息内容全文检索，命中后直接跳到对应会话。' },
      ] },
    { id: 'sA1', title: 'A-1：折叠状态与展开动画', parent: 'sA', forkAt: 1, running: false, pending: false, done: false, current: false,
      messages: [
        { user: '折叠状态要记住吗？', reply: '先做会话内记忆；持久化后续再评估。' },
        { user: '展开动画不要太花哨', reply: '160ms 渐入即可。' },
      ] },
    { id: 'sA2', title: 'A-2：分支间消息对比', parent: 'sA', forkAt: 1, running: false, pending: false, done: true, current: false,
      messages: [
        { user: '想对比两个分支在分叉点之后的差异', reply: '可以做一个 diff 视图，两边并排。' },
      ] },
    { id: 'sB', title: '分支 B：导图悬浮面板', parent: 's0', forkAt: 5, running: false, pending: false, done: false, current: false,
      messages: [
        { user: '导图用什么布局？', reply: '经典水平思维导图：根在左，子节点向右展开；拖拽平移、滚轮缩放。' },
        { user: '节点上要能直接开分支', reply: '悬停节点出现 打开/⑂/✂，✂ 在右侧滑出选点面板。' },

      messages: [

        { user: '节点太多时卡吗？', reply: '先全量渲染，超阈值再做虚拟化。' },

    { id: 'sC', title: '分支 C：会话回溯与继续', parent: 's0', forkAt: 3, running: false, pending: true, done: false, current: false,

        { user: '回到旧会话继续聊，会不会影响分支？', reply: '不会，各分支独立，树只是把血缘可视化。' },

      { id: 'a1', label: '调研：嵌套树布局算法', mode: 'continuable', running: true },

    ],

};

const byId = () => {
  const m = new Map();
  DATA.sessions.forEach(s => m.set(s.id, s));
  return m;
};

let collapsed = new Set();
let currentId = 's0';
let mapOpen = false;
let mapView = { s: 1, tx: 20, ty: 20 };
let seqN = 0;
const nextId = () => 'ns' + (++seqN);

/* ============ 工具 ============ */
const $ = (sel, root) => (root || document).querySelector(sel);
let toastTimer = null;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

function childCountOf(id) {
  return DATA.sessions.filter(s => s.parent === id).length;
}
function hasChildren(id) {
  if (DATA.sessions.some(s => s.parent === id)) return true;
  return !!(DATA.subagents[id] && DATA.subagents[id].length);
}

/* ============ 分叉（演示） ============ */
function doFork(parentId, forkAt /* 消息序号，null=末尾 */) {
  const map = byId();
  const parent = map.get(parentId);
  const n = childCountOf(parentId) + 1;
  const child = {
    id: nextId(),
    title: '新分支 ' + n,
    parent: parentId,
    forkAt,
    running: false, pending: false, done: false, current: false,
    isNew: true,
    messages: forkAt === null
      ? [{ user: '（在「' + parent.title + '」的末尾继续）', reply: '这是一个新分支。' }]
      : [{ user: '（继承「' + parent.title + '」前 ' + forkAt + ' 轮对话）', reply: '这是一个新分支。' }],
  };
  DATA.sessions.push(child);
  DATA.sessions.forEach(s => { s.current = false; });
  child.current = true;
  currentId = child.id;
  collapsed.delete(parentId);
  renderTree();
  updateChat();
  if (mapOpen) renderMap();
  const at = forkAt === null ? '末尾' : '第 ' + forkAt + ' 条消息后';
  toast('已从「' + parent.title + '」的 ' + at + ' 分叉，并打开新分支');
  // 让新节点闪一下
  const el = document.querySelector('.row[data-id="' + child.id + '"]');
  if (el) { el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1500); }
}

/* ============ 选点面板 ============ */
function pickerHTML(session) {
  const head = '<div class="picker-head"><span>✂ 从哪一轮对话之后分叉？</span><button class="picker-close">✕</button></div>';
  let rows = '';
  session.messages.forEach((m, i) => {
    rows += '<div class="turn" data-at="' + (i + 1) + '">'
      + '<div class="turn-user"><span class="idx">' + (i + 1) + '.</span>' + esc(m.user) + '</div>'
      + '<div class="turn-reply">↳ ' + esc(m.reply) + '</div>'
      + '<span class="fork-hint">在此分叉 →</span>'
      + '</div>';
  });
  const foot = '<div class="picker-foot"><button class="btn primary" data-at="null">＋ 直接在末尾继续分叉</button></div>';
  return head + rows + foot;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function bindPicker(host, session, onDone) {
  host.innerHTML = pickerHTML(session);
  host.querySelectorAll('.turn').forEach(t => {
    t.addEventListener('click', e => {
      e.stopPropagation();
      doFork(session.id, parseInt(t.dataset.at, 10));
      if (onDone) onDone();
    });
  });
  host.querySelector('[data-at="null"]').addEventListener('click', e => {
    e.stopPropagation();
    doFork(session.id, null);
    if (onDone) onDone();
  });
  host.querySelector('.picker-close').addEventListener('click', e => {
    e.stopPropagation();
    host.innerHTML = '';
  });
}

/* ============ 侧边栏树 ============ */
function renderTree() {
  const treeEl = $('#tree');
  treeEl.innerHTML = '';
  const map = byId();
  const kids = new Map();
  DATA.sessions.forEach(s => {
    if (!s.parent) return;
    const arr = kids.get(s.parent) || [];
    arr.push(s);
    kids.set(s.parent, arr);
  });
  const roots = DATA.sessions.filter(s => !s.parent);

  function subNodes(id) {
    const arr = DATA.subagents[id] || [];
    return arr.map(e => ({ sub: e }));
  }

  function renderNode(node, depth, sub) {
    const id = sub ? 'sub:' + node.sub.id : node.id;
    const nodeEl = document.createElement('div');
    nodeEl.className = 'node';

    const row = document.createElement('div');
    row.className = 'row' + (node.current ? ' current' : '') + (sub ? '' : '');
    row.dataset.id = id;
    if (!sub) row.dataset.sid = node.id;

    const hasKids = sub ? false : hasChildren(node.id);
    const chev = document.createElement('button');
    chev.className = 'chevron' + (hasKids ? '' : ' empty');
    chev.textContent = collapsed.has(id) ? '▸' : '▾';
    chev.addEventListener('click', e => {
      e.stopPropagation();
      if (!hasKids) return;
      if (collapsed.has(id)) collapsed.delete(id); else collapsed.add(id);
      renderTree();
    });
    row.appendChild(chev);

    const icon = document.createElement('span');
    icon.className = 'row-icon';
    icon.textContent = sub ? '🤖' : (node.parent ? '🔀' : '💬');
    row.appendChild(icon);

    const title = document.createElement('span');
    title.className = 'row-title';
    title.textContent = sub ? node.sub.label : node.title;
    row.appendChild(title);

    const tags = document.createElement('span');
    tags.className = 'row-tags';
    if (sub) {
      const t = document.createElement('span');
      t.className = 'tag sub';
      t.textContent = node.sub.mode === 'continuable' ? '可继续' : '一次性';
      tags.appendChild(t);
    } else if (node.parent && node.forkAt !== null && node.forkAt !== undefined) {
      const t = document.createElement('span');
      t.className = 'tag fork';
      t.textContent = '⑂ ' + node.forkAt;
      tags.appendChild(t);
    }
    if (!sub && node.running) tags.appendChild(dotEl('run'));
    if (sub && node.sub.running) tags.appendChild(dotEl('run'));
    if (node.pending) tags.appendChild(dotEl('wait'));
    if (node.done) tags.appendChild(dotEl('done'));
    row.appendChild(tags);

    const acts = document.createElement('span');
    acts.className = 'acts';
    if (!sub) {
      const forkTail = document.createElement('button');
      forkTail.className = 'act primary';
      forkTail.title = '在末尾开新分支';
      forkTail.textContent = '⑂';
      forkTail.addEventListener('click', e => { e.stopPropagation(); doFork(node.id, null); });
      acts.appendChild(forkTail);

      const forkPick = document.createElement('button');
      forkPick.className = 'act primary';
      forkPick.title = '从某条消息后开分支';
      forkPick.textContent = '✂';
      forkPick.addEventListener('click', e => {
        e.stopPropagation();
        const slot = nodeEl.querySelector('.picker-slot');
        if (slot.innerHTML) { slot.innerHTML = ''; return; }
        bindPicker(slot, node, () => { slot.innerHTML = ''; });
      });
      acts.appendChild(forkPick);
    }
    row.appendChild(acts);

    row.addEventListener('click', () => {
      DATA.sessions.forEach(s => { s.current = false; });
      if (sub) {
        toast('（演示）打开子代理：' + node.sub.label);
      } else {
        node.current = true;
        currentId = node.id;
        updateChat();
        toast('已打开会话「' + node.title + '」');
      }
      renderTree();
    });

    nodeEl.appendChild(row);

    const slot = document.createElement('div');
    slot.className = 'picker-slot';
    nodeEl.appendChild(slot);

    if (hasKids && !sub) {
      const childWrap = document.createElement('div');
      childWrap.className = 'children' + (collapsed.has(id) ? ' hidden' : '');
      (kids.get(node.id) || []).forEach(c => childWrap.appendChild(renderNode(c, depth + 1, false)));
      subNodes(node.id).forEach(s => childWrap.appendChild(renderNode(s, depth + 1, true)));
      nodeEl.appendChild(childWrap);
    }
    return nodeEl;
  }

  roots.forEach(r => treeEl.appendChild(renderNode(r, 0, false)));
}

function dotEl(kind) {
  const d = document.createElement('span');
  d.className = 'dot ' + kind;
  return d;
}

/* ============ 聊天主区 ============ */
function updateChat() {
  const map = byId();
  const s = map.get(currentId) || DATA.sessions[0];
  $('#chat-title').textContent = s.title;
  const inherit = $('#chat-inherit');
  if (s.parent && s.forkAt != null) {
    inherit.classList.remove('hidden');
    inherit.textContent = '继承自「' + (map.get(s.parent) ? map.get(s.parent).title : '源会话') + '」前 ' + s.forkAt + ' 轮';
  } else {
    inherit.classList.add('hidden');
  }
}

/* ============ 搜索（演示） ============ */
const searchIndex = (() => {
  const idx = [];
  DATA.sessions.forEach(s => {
    s.messages.forEach(m => {
      idx.push({ id: s.id, title: s.title, text: m.user + ' ' + m.reply });
    });
  });
  return idx;
})();
function renderSearch(q) {
  const box = $('#search-results');
  if (!q) { box.classList.add('hidden'); box.innerHTML = ''; return; }
  const qq = q.toLowerCase();
  const hits = searchIndex.filter(h => h.text.toLowerCase().includes(qq)).slice(0, 8);
  if (hits.length === 0) {
    box.classList.add('hidden'); box.innerHTML = ''; return;
  }
  box.innerHTML = hits.map(h =>
    '<div class="sr-item" data-id="' + h.id + '"><div class="sr-title">' + esc(h.title) + '</div><div class="sr-snippet">' + esc(h.text.slice(0, 60)) + '…</div></div>'
  ).join('');
  box.classList.remove('hidden');
  box.querySelectorAll('.sr-item').forEach(item => {
    item.addEventListener('click', () => {
      const id = item.dataset.id;
      const s = byId().get(id);
      if (!s) return;
      DATA.sessions.forEach(x => { x.current = false; });
      s.current = true;
      currentId = id;
      collapsed.delete(id);
      renderTree();
      updateChat();
      box.classList.add('hidden');
      box.innerHTML = '';
      $('#search-input').value = '';
      toast('搜索命中，已打开「' + s.title + '」');
    });
  });
}

/* ============ 思维导图 ============ */
function layoutTree() {
  const map = byId();
  const kids = new Map();
  DATA.sessions.forEach(s => {
    if (s.parent && map.has(s.parent)) {
      const arr = kids.get(s.parent) || [];
      arr.push({ id: s.id, sub: false });
      kids.set(s.parent, arr);
    }
  });
  Object.entries(DATA.subagents).forEach(([pid, arr]) => {
    arr.forEach(e => {
      const a = kids.get(pid) || [];
      a.push({ id: 'sub:' + e.id, parent: pid, sub: true, label: e.label, mode: e.mode, running: e.running });
      kids.set(pid, a);
    });
  });
  const roots = DATA.sessions.filter(s => !s.parent || !map.has(s.parent)).map(s => ({ id: s.id, sub: false }));

  const NW = 208, NH = 96, GX = 90, LG = 22;
  const pos = new Map();
  const edges = [];
  let y = 24;
  function place(n, depth) {
    const ch = kids.get(n.id) || [];
    let myY;
    if (ch.length === 0) {
      myY = y + NH / 2;
      y += NH + LG;
    } else {
      const ys = ch.map(c => place(c, depth + 1));
      myY = (Math.min.apply(null, ys) + Math.max.apply(null, ys)) / 2;
    }
    pos.set(n.id, { x: 24 + depth * (NW + GX), y: myY - NH / 2 });
    if (n.sub) {
      edges.push({ from: n.parent, to: n.id, sub: true, label: '子代理' });
    } else if (n.parent && pos.has(n.parent)) {
      const s = map.get(n.id);
      const at = (s && s.forkAt != null) ? s.forkAt : null;
      edges.push({ from: n.parent, to: n.id, sub: false, label: at === null ? '在末尾继续' : '分叉于第 ' + at + ' 条消息' });
    }
    return myY;
  }
  roots.forEach(r => { place(r, 0); y += 30; });

  const xs = [], ys = [];
  pos.forEach(p => { xs.push(p.x); ys.push(p.y); });
  const width = xs.length ? Math.max.apply(null, xs) + NW + 24 : 400;
  const height = ys.length ? Math.max.apply(null, ys) + NH + 24 : 300;
  return { pos, edges, width, height };
}

function renderMap() {
  const canvas = $('#map-canvas');
  const inner = $('#map-inner');
  const lay = layoutTree();
  inner.style.width = lay.width + 'px';
  inner.style.height = lay.height + 'px';

  // 边
  let svg = '';
  lay.edges.forEach(e => {
    const a = lay.pos.get(e.from);
    const b = lay.pos.get(e.to);
    const x1 = a.x + 208, y1 = a.y + 48;
    const x2 = b.x, y2 = b.y + 48;
    const mx = (x1 + x2) / 2;
    svg += '<path d="M ' + x1 + ' ' + y1 + ' C ' + mx + ' ' + y1 + ', ' + mx + ' ' + y2 + ', ' + x2 + ' ' + y2 + '" '
      + 'fill="none" stroke="' + (e.sub ? 'var(--purple)' : 'var(--accent)') + '" stroke-width="1.6" '
      + (e.sub ? 'stroke-dasharray="5 4"' : '') + ' opacity="0.75"></path>';
  });
  const edgesSvg = '<svg id="map-edges" width="' + lay.width + '" height="' + lay.height + '">' + svg + '</svg>';

  // 卡片 + 连线标签
  let cards = '';
  lay.edges.forEach(e => {
    const a = lay.pos.get(e.from), b = lay.pos.get(e.to);
    const mx = (a.x + 208 + b.x) / 2, my = (a.y + b.y) / 2 + 24;
    cards += '<div class="edge-label' + (e.sub ? ' sub' : '') + '" style="left:' + mx + 'px;top:' + my + 'px">' + esc(e.label) + '</div>';
  });
  const map = byId();
  pos: for (const [id, p] of lay.pos) {
    if (id.startsWith('sub:')) {
      const key = id.slice(4);
      let entry = null, parentId = null;
      for (const [pid, arr] of Object.entries(DATA.subagents)) {
        const hit = arr.find(e => e.id === key);
        if (hit) { entry = hit; parentId = pid; break; }
      }
      cards += cardHTML({
        id, sub: true, title: '🤖 ' + entry.label,
        meta: (entry.mode === 'continuable' ? '可继续' : '一次性') + ' · 子代理',
        status: entry.running ? '运行中' : '空闲',
        running: entry.running, current: false, x: p.x, y: p.y, parentId,
      });
    } else {
      const s = map.get(id);
      const forkKids = DATA.sessions.filter(x => x.parent === id).length;
      const status = s.running ? '运行中' : (s.pending ? '等待处理' : (s.done ? '已完成提醒' : ''));
      cards += cardHTML({
        id, sub: false, title: (s.parent ? '🔀 ' : '💬 ') + s.title,
        meta: s.messages.length + ' 轮对话' + (forkKids ? ' · ' + forkKids + ' 个分支' : ''),
        status, running: s.running, pending: s.pending, done: s.done,
        current: s.current, x: p.x, y: p.y, parentId: null,
      });
    }
  }
  inner.innerHTML = edgesSvg + cards;
  applyView();

  inner.querySelectorAll('.map-card').forEach(card => {
    const id = card.dataset.id;
    card.addEventListener('click', e => {
      if (e.target.closest('.mc-acts')) return;
      if (id.startsWith('sub:')) {
        toast('（演示）打开子代理');
        return;
      }
      DATA.sessions.forEach(s => { s.current = false; });
      const s = map.get(id);
      if (s) { s.current = true; currentId = id; }
      updateChat();
      renderTree();
      renderMap();
      toast('已打开会话「' + s.title + '」');
    });
    card.querySelectorAll('.act-open').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      card.click();
    }));
    card.querySelectorAll('.act-fork').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      doFork(id, null);
    }));
    card.querySelectorAll('.act-pick').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      openMapPicker(id);
    }));
  });
}

function cardHTML(c) {
  const dots = [];
  if (c.running) dots.push('<span class="dot run"></span>');
  if (c.pending) dots.push('<span class="dot wait"></span>');
  if (c.done) dots.push('<span class="dot done"></span>');
  return '<div class="map-card' + (c.current ? ' current' : '') + (c.sub ? ' sub' : '') + '" data-id="' + c.id + '" '
    + 'style="left:' + c.x + 'px;top:' + c.y + 'px">'
    + '<div class="mc-title">' + esc(c.title) + '</div>'
    + '<div class="mc-meta">' + esc(c.meta) + '</div>'
    + (c.status ? '<div class="mc-status">' + dots.join('') + esc(c.status) + '</div>' : '')
    + '<div class="mc-acts">'
    + '<button class="btn act-open">打开</button>'
    + (c.sub ? '' : '<button class="btn act-fork">⑂ 分叉</button><button class="btn act-pick">✂ 选点</button>')
    + '</div></div>';
}

function applyView() {
  const inner = $('#map-inner');
  inner.style.transform = 'translate(' + mapView.tx + 'px,' + mapView.ty + 'px) scale(' + mapView.s + ')';
}
function fitMap() {
  const lay = layoutTree();
  const canvas = $('#map-canvas');
  const cw = canvas.clientWidth, ch = canvas.clientHeight;
  mapView.s = Math.max(0.2, Math.min(1, (cw - 60) / lay.width, (ch - 60) / lay.height));
  mapView.tx = Math.max(12, (cw - lay.width * mapView.s) / 2);
  mapView.ty = Math.max(12, (ch - lay.height * mapView.s) / 2);
  applyView();
}
function zoomAt(px, py, factor) {
  const nx = (px - mapView.tx) / mapView.s;
  const ny = (py - mapView.ty) / mapView.s;
  mapView.s = Math.max(0.2, Math.min(2, mapView.s * factor));
  mapView.tx = px - nx * mapView.s;
  mapView.ty = py - ny * mapView.s;
  applyView();
}
function openMapPicker(id) {
  const pane = $('#map-picker');
  if (id.startsWith('sub:')) return;
  const s = byId().get(id);
  if (!s) return;
  pane.classList.remove('hidden');
  bindPicker(pane, s, () => { pane.classList.add('hidden'); });
  // 更新面板标题下的关闭
  const head = pane.querySelector('.picker-head');
  if (head) {
    let span = head.querySelector('span');
    span.textContent = '✂ 「' + s.title + '」从哪轮之后分叉？';
  }
  pane.querySelector('.picker-close').addEventListener('click', () => {
    pane.classList.add('hidden');
    pane.innerHTML = '';
  });
}

function openMap() {
  mapOpen = true;
  $('#map-overlay').classList.remove('hidden');
  renderMap();
  requestAnimationFrame(fitMap);
}
function closeMap() {
  mapOpen = false;
  $('#map-overlay').classList.add('hidden');
  $('#map-picker').classList.add('hidden');
  $('#map-picker').innerHTML = '';
}

/* ============ 初始化 ============ */
function init() {
  // 工作区 chips（演示）
  const chips = [['当前工作区', true], ['全部会话', false]];
  $('#ws-chips').innerHTML = chips.map(([label, active]) =>
    '<button class="chip' + (active ? ' active' : '') + '">' + label + '</button>').join('');
  $('#ws-chips').querySelectorAll('.chip').forEach(c => {
    c.addEventListener('click', () => {
      $('#ws-chips').querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
      c.classList.add('active');
      toast('（演示）切换视图范围：' + c.textContent);
    });
  });

  $('#btn-new').addEventListener('click', () => toast('（演示）新建会话'));
  $('#btn-map').addEventListener('click', openMap);
  $('#map-close').addEventListener('click', closeMap);
  $('#map-zoom-in').addEventListener('click', () => {
    const canvas = $('#map-canvas');
    zoomAt(canvas.clientWidth / 2, canvas.clientHeight / 2, 1.2);
  });
  $('#map-zoom-out').addEventListener('click', () => {
    const canvas = $('#map-canvas');
    zoomAt(canvas.clientWidth / 2, canvas.clientHeight / 2, 1 / 1.2);
  });
  $('#map-fit').addEventListener('click', fitMap);

  // 搜索
  let searchTimer = null;
  $('#search-input').addEventListener('input', e => {
    clearTimeout(searchTimer);
    const q = e.target.value.trim();
    searchTimer = setTimeout(() => renderSearch(q), 160);
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('.search-wrap')) renderSearch('');
  });

  // 导图平移 / 缩放
  const canvas = $('#map-canvas');
  let drag = null;
  canvas.addEventListener('pointerdown', e => {
    if (e.target.closest('.map-card') || e.target.closest('.edge-label') || e.target.closest('.map-hint')) return;
    drag = { x: e.clientX, y: e.clientY, tx: mapView.tx, ty: mapView.ty };
    canvas.classList.add('dragging');
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    if (!drag) return;
    mapView.tx = drag.tx + (e.clientX - drag.x);
    mapView.ty = drag.ty + (e.clientY - drag.y);
    applyView();
  });
  const endDrag = e => {
    if (!drag) return;
    drag = null;
    canvas.classList.remove('dragging');
  };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    zoomAt(e.clientX - rect.left, e.clientY - rect.top, e.deltaY < 0 ? 1.12 : 1 / 1.12);
  }, { passive: false });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (mapOpen) closeMap();
      else document.querySelectorAll('.picker-slot').forEach(x => { x.innerHTML = ''; });
    }
  });

  renderTree();
  updateChat();
}

init();
</script>
</body>
</html>
